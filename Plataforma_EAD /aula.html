<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plataforma Complexo DMC — Aula em curso.">
  <meta name="robots" content="noindex, nofollow">
  <title>Aula · Plataforma Complexo DMC</title>

  <link rel="icon" type="image/png" href="../assets/images/LOGO_RINOCERONTE.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Raleway:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/plataforma.css">
</head>
<body class="bg-grid">
  <div class="glow-corner"></div>

  <header class="app-nav">
    <div class="app-nav__inner">
      <a class="app-brand" href="dashboard.html">
        <img src="../assets/images/RINO_logo.png" alt="Complexo DMC">
        <span class="app-brand__label">Complexo DMC</span>
        <span class="app-brand__sub">Plataforma</span>
      </a>
      <div class="app-user">
        <a class="btn-ghost" href="loja.html">Loja</a>
        <a class="btn-ghost" href="admin.html" data-admin-only>Admin</a>
        <span data-user-nome></span>
        <span class="user-avatar" data-user-iniciais></span>
        <button class="btn-ghost" data-logout>Sair</button>
      </div>
    </div>
  </header>

  <main class="player-shell">
    <div class="dash-inner" id="player-root">
      <a class="player-back" href="dashboard.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar ao painel
      </a>

      <div class="player-grid">
        <div>
          <div class="player-stage" id="player-stage"></div>

          <div class="player-meta">
            <span class="overline" data-aula-modulo>—</span>
            <h1 data-aula-titulo>—</h1>
            <div class="player-meta__row">
              <span data-aula-num></span>
              <span data-aula-dur></span>
            </div>
            <div class="player-actions">
              <button class="btn-ghost" id="btn-prev">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                Aula anterior
              </button>
              <button class="btn-primary" id="btn-done" style="width:auto; margin-top:0; gap:0.5rem;"></button>
              <button class="btn-ghost" id="btn-next">
                Próxima aula
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>
          </div>
        </div>

        <aside class="player-aside">
          <div class="player-aside__head">
            <span class="overline">Trilha do programa</span>
            <h3 data-curso-titulo>—</h3>
          </div>
          <div id="player-aside-list"></div>
        </aside>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>DMC_bootPlayer();</script>
</body>
</html>
