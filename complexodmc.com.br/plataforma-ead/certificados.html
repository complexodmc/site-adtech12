<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Certificados de conclusão dos seus cursos.">
  <meta name="robots" content="noindex, nofollow">
  <title>Certificados · Plataforma Complexo DMC</title>

  <link rel="icon" type="image/png" href="../assets/images/LOGO_RINOCERONTE.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Raleway:wght@500;600;700;800&display=swap" rel="stylesheet">

</head>
<body class="bg-grid" data-shell="certificados">
  <div class="glow-corner"></div>

  <main class="dash-shell">
    <div class="dash-inner">
      <section class="pagina-hero">
        <span class="overline">Certificados</span>
        <h1>Seus certificados de <span class="gradient-text">conclusão</span></h1>
        <p>O certificado é emitido quando você conclui todas as aulas disponíveis de um curso. Cada documento recebe um código único de validação, que qualquer pessoa pode conferir sem precisar de conta na plataforma.</p>
      </section>

      <section id="certificados-lista" class="certificados-lista"></section>
    </div>
  </main>

  <script src="js/api-client.js"></script>
  <script src="js/app.js"></script>
  <script src="js/shell.js"></script>
  <script>DMC_bootCertificados();</script>
