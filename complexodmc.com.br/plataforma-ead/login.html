<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plataforma Complexo DMC — Acesso institucional ao programa de formação Arquitetura Patrimonial Estratégica.">
  <meta name="robots" content="noindex, nofollow">
  <title>Acesso · Plataforma Complexo DMC</title>

  <link rel="icon" type="image/png" href="../assets/images/LOGO_RINOCERONTE.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Raleway:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/plataforma.css">
</head>
<body class="bg-grid">
  <div class="glow-corner"></div>

  <main class="login-shell">
    <section class="login-card">
      <img src="../assets/images/RINO_logo.png" alt="Complexo DMC" class="login-logo">
      <span class="overline login-overline">Plataforma Institucional</span>
      <h1 class="login-title">Arquitetura Patrimonial <span class="gradient-text">Estratégica</span></h1>
      <p class="login-sub">Acesso reservado aos alunos e clientes institucionais do Complexo DMC.</p>

      <form id="login-form" autocomplete="off" novalidate>
        <div class="field">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Como gostaria de ser chamado" autocomplete="name">
        </div>
        <div class="field">
          <label for="email">E-mail institucional</label>
          <input type="email" id="email" name="email" required placeholder="seuemail@dominio.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <p id="login-error" class="login-error" role="alert" hidden></p>
        <button type="submit" class="btn-primary">Acessar plataforma</button>
      </form>

      <p class="login-foot">
        Acesso problemas? Entre em contato com <a href="mailto:administrativo@complexodmc.com.br">administrativo@complexodmc.com.br</a>
      </p>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>DMC_bootLogin();</script>
</body>
</html>
