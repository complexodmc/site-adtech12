<head>

  <link rel="stylesheet" href="../assets/css/tokens.css?v=1">

<body data-shell="comprovantes" data-pagina="comprovantes">
  <a class="dmc-skip" href="#conteudo">Pular para o conteúdo</a>

  <main id="conteudo" class="pf-main" tabindex="-1">
    <header class="pf-cabecalho">
      <p class="pf-cabecalho__contexto">Documentação</p>
      <h1 class="pf-cabecalho__titulo">Comprovantes</h1>
      <p class="pf-cabecalho__desc">Registro das suas avaliações e da sua frequência, com código verificável.</p>
      <div class="pf-cabecalho__acoes pf-nao-imprimir">
        <button type="button" class="dmc-btn dmc-btn--secondary" id="ac-imprimir" disabled>Imprimir comprovantes</button>
      </div>
    </header>

    <section class="pf-so-impressao pf-ac-impressao" id="ac-impressao-cabecalho" aria-hidden="true"></section>

    <form class="pf-ac-filtros pf-nao-imprimir" id="ac-filtros" role="search" aria-label="Filtrar comprovantes">
      <div class="pf-campo">
        <label class="pf-rotulo" for="ac-f-curso">Curso</label>
        <select class="pf-input" id="ac-f-curso" name="curso"><option value="">Todos os cursos</option></select>
      </div>
      <div class="pf-segmento" role="group" aria-label="Tipo de registro">
        <button type="button" class="pf-segmento__opcao" data-ac-tipo="todos" aria-pressed="true">Tudo</button>
        <button type="button" class="pf-segmento__opcao" data-ac-tipo="avaliacoes" aria-pressed="false">Avaliações</button>
        <button type="button" class="pf-segmento__opcao" data-ac-tipo="frequencia" aria-pressed="false">Frequência</button>
      </div>
      <div class="pf-campo">
        <label class="pf-rotulo" for="ac-f-de">De</label>
        <input class="pf-input" type="date" id="ac-f-de" name="de">
      </div>
      <div class="pf-campo">
        <label class="pf-rotulo" for="ac-f-ate">Até</label>
        <input class="pf-input" type="date" id="ac-f-ate" name="ate">
      </div>
    </form>

    <section id="ac-comprovantes" aria-busy="true" aria-label="Registros">
      <div class="pf-ac-carregando" aria-hidden="true">
        <div class="pf-esqueleto pf-esqueleto--linha"></div>
        <div class="pf-esqueleto pf-esqueleto--linha"></div>
        <div class="pf-esqueleto pf-esqueleto--linha"></div>
        <div class="pf-esqueleto pf-esqueleto--linha"></div>
        <div class="pf-esqueleto pf-esqueleto--linha"></div>
        <div class="pf-esqueleto pf-esqueleto--linha"></div>
      </div>
      <noscript><p class="pf-ajuda">Esta tela precisa de JavaScript para listar seus comprovantes.</p></noscript>
    </section>

    <p class="pf-ajuda">Horário de Brasília. Copie o código de uma linha ou use “Verificar” para conferir o registro na página pública de validação.</p>
    <section class="pf-so-impressao pf-ac-impressao" id="ac-impressao-rodape" aria-hidden="true"></section>
    <p class="dmc-sr-only" id="ac-anuncio" role="status" aria-live="polite"></p>
  </main>

  <script src="js/api-client.js?v=dev"></script>
  <script src="js/app.js?v=dev"></script>
  <script src="js/portal/ui.js?v=dev"></script>
  <script src="js/shell.js?v=dev"></script>
  <script src="js/portal/comprovantes.js?v=dev"></script>
</body>
</html>
