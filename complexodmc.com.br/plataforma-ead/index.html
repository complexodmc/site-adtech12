<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plataforma Complexo DMC — redirecionamento de acesso.">
  <meta name="robots" content="noindex, nofollow">
  <title>Plataforma Complexo DMC</title>
  <link rel="icon" type="image/png" href="../assets/images/LOGO_RINOCERONTE.png">
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    (async function () {
      try {
        const { data: { session } } = await window.DMC_supa.auth.getSession();
        window.location.replace(session ? 'dashboard.html' : 'login.html');
      } catch (e) {
        window.location.replace('login.html');
      }
    })();
  </script>
  <noscript>
    <p style="font-family:sans-serif;text-align:center;margin:4rem">
      Habilite o JavaScript para acessar a plataforma. Se preferir, vá direto para
      <a href="login.html">login</a>.
    </p>
  </noscript>
</body>
</html>
